<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="housingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5548"/>
      <stop offset="50%" stop-color="#263d32"/>
      <stop offset="100%" stop-color="#1b281f"/>
    </linearGradient>
    <radialGradient id="drumGrad" cx="45%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#7a917c"/>
      <stop offset="60%" stop-color="#3a5548"/>
      <stop offset="100%" stop-color="#1e2f25"/>
    </radialGradient>
    <linearGradient id="chamberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ec"/>
      <stop offset="100%" stop-color="#e8e2d4"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="16" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="4" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.25" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Base platform -->
  <rect x="70" y="610" width="760" height="120" rx="34" fill="#263d32" filter="url(#dropShadow)"/>
  <rect x="70" y="610" width="760" height="120" rx="34" fill="none" stroke="#4a6456" stroke-width="2"/>

  <!-- Main housing -->
  <rect x="130" y="120" width="640" height="520" rx="48" fill="url(#housingGrad)" filter="url(#dropShadow)"/>
  <rect x="130" y="120" width="640" height="520" rx="48" fill="none" stroke="#4a6456" stroke-width="3"/>

  <!-- Drum cylinder -->
  <circle cx="450" cy="360" r="205" fill="url(#drumGrad)" stroke="#849274" stroke-width="8" filter="url(#dropShadow)"/>
  <circle cx="450" cy="360" r="200" fill="none" stroke="#dccccb" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>

  <!-- Center hub -->
  <circle cx="450" cy="360" r="34" fill="#1b281f" stroke="#849274" stroke-width="4"/>
  <circle cx="450" cy="360" r="18" fill="#3a5548"/>
  <circle cx="450" cy="360" r="6" fill="#dccccb"/>

  <!-- Chambers -->
  <g fill="url(#chamberGrad)" stroke="#849274" stroke-width="5" filter="url(#innerShadow)">
    <circle cx="450" cy="185" r="56"/>
    <circle cx="625" cy="360" r="56"/>
    <circle cx="450" cy="535" r="56"/>
    <circle cx="275" cy="360" r="56"/>
  </g>

  <!-- Chamber labels -->
  <g fill="#1b281f" font-family="Georgia, serif" font-weight="800" font-size="26" text-anchor="middle" dominant-baseline="middle">
    <text x="450" y="185">1</text>
    <text x="625" y="360">2</text>
    <text x="450" y="535">3</text>
    <text x="275" y="360">4</text>
  </g>

  <!-- Shutter / access window -->
  <rect x="350" y="340" width="200" height="40" rx="10" fill="#161c15"/>
  <rect x="350" y="340" width="200" height="40" rx="10" fill="none" stroke="#dccccb" stroke-width="4"/>
  <rect x="350" y="340" width="200" height="40" rx="8" fill="#6b8270" opacity="0.92"/>

  <!-- Winding knob -->
  <circle cx="735" cy="520" r="30" fill="#6b8270" stroke="#1b281f" stroke-width="4"/>
  <circle cx="735" cy="520" r="22" fill="#3a5548"/>
  <path d="M735 505 L735 492" stroke="#dccccb" stroke-width="3" stroke-linecap="round"/>
  <path d="M720 520 L707 520" stroke="#dccccb" stroke-width="3" stroke-linecap="round"/>

  <!-- Drive belt detail -->
  <ellipse cx="450" cy="360" rx="175" ry="165" fill="none" stroke="#3a5548" stroke-width="6" opacity="0.5"/>

  <!-- Scent accent indicators -->
  <g fill="#dccccb" opacity="0.8">
    <circle cx="450" cy="120" r="7"/>
    <circle cx="620" cy="150" r="6"/>
    <circle cx="280" cy="150" r="7"/>
    <circle cx="450" cy="600" r="6"/>
    <circle cx="140" cy="360" r="7"/>
    <circle cx="760" cy="360" r="6"/>
  </g>

  <!-- Rim highlight -->
  <circle cx="450" cy="360" r="205" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="3"/>
</svg>
